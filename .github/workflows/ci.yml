name: CI Pipeline

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest and Generate JSON Report
        id: run_tests
        continue-on-error: true
        run: |
          pip install pytest-json-report
          pytest --json-report --json-report-file=report.json

      - name: Send Report to Local Receiver via Tunnel
        if: always()
        run: |
          python -c "
          import json, requests
          try:
              with open('report.json') as f:
                  data = json.load(f)
              payload = {
                  'repository': '${{ github.repository }}',
                  'branch': '${{ github.ref_name }}',
                  'commit_sha': '${{ github.sha }}',
                  'run_id': '${{ github.run_id }}',
                  'timestamp': '${{ github.event.head_commit.timestamp }}',
                  'summary': data.get('summary', {}),
                  'tests': data.get('tests', [])
              }
              # Apna ngrok URL yahan dalein
              response = requests.post('https://angry-camels-bathe.loca.lt', json=payload)
              print(response.status_code, response.text)
          except Exception as e:
              print('Error sending report:', e)
          "

      - name: Fail Pipeline if Tests Failed
        if: steps.run_tests.outcome != 'success'
        run: exit 1